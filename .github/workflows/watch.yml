name: watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i web-push @ton/core --no-audit --no-fund
      - run: node watch.js
        env:
          ESCROW: kQA9xDfXFTz-n0UZ5u96Pb-Jg8NfZ652ohI0NX4LGVawUCio
          FBKEY: AIzaSyDG2au7nsY0EaOhpa-hhrnoBfkTUlipsrw
          VAPID_PUBLIC: BL2zdukSPDeW9m9au6qXOQSUNX-n_aUtfH0UiwnLvuOYVe8PGGsAPu5VOmcNfKfbUo0LGSqJblEIB_hYJvOOeKs
          TCKEY: ${{ secrets.TCKEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m state && git push)
